name: Bug Report
description: Report a bug in VoxWave
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian
        - Fedora
        - Arch Linux
        - Other Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: VoxWave version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Transcription mode
      options:
        - Cloud (Groq)
        - Local (Whisper)
        - Hybrid
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press F8
        2. Speak for 5 seconds
        3. Press F8 again
        4. See error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Paste relevant logs from `~/.voxwave/voxwave.log`
      render: shell
