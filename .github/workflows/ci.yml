name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libegl1 libgl1-mesa-dri libxkbcommon0 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          pytest tests/ -q \
            --ignore=tests/test_waveform_widget.py \
            --ignore=tests/test_tray_icon.py \
            --ignore=tests/test_app_init.py \
            --ignore=tests/test_app_pipeline.py \
            --ignore=tests/test_audio_feedback.py \
            --ignore=tests/test_settings_focus.py \
            --ignore=tests/test_welcome_dialog.py

      - name: Lint
        run: |
          flake8 src/ --max-line-length=120 --count --show-source --statistics
