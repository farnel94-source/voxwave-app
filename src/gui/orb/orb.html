<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wave Voice Input</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

/* === Main container === */
.voice-input {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 9999px;
    padding: 4px;
    gap: 0;
    border: 1.5px solid transparent;
    background: transparent;
    /* Spring-like expansion (cubic-bezier custom) */
    transition:
        padding 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.4s ease;
}

/* Active state: transparent, sans pilule */
.voice-input.active {
    padding: 4px;
    border-color: transparent;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

.voice-input.active:hover {
    border-color: transparent;
    box-shadow: none;
}

/* === Logo === */
.logo-icon {
    width: 100px;
    height: 100px;
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.3s ease;
    /* Idle: respiration subtile via animation */
    animation: breathe 3.5s ease-in-out infinite;
}

/* Respiration à l'idle — glow blanc ultra-subtil */
@keyframes breathe {
    0%, 100% {
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.1))
                drop-shadow(0 3px 10px rgba(0, 0, 0, 0.35));
    }
    50% {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.22))
                drop-shadow(0 3px 14px rgba(0, 0, 0, 0.3));
    }
}

/* Au recording: logo pulse plus vif */
.voice-input.active .logo-icon {
    animation: breathe-active 1.8s ease-in-out infinite;
}

@keyframes breathe-active {
    0%, 100% {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2))
                drop-shadow(0 2px 12px rgba(0, 0, 0, 0.35));
    }
    50% {
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.45))
                drop-shadow(0 2px 18px rgba(0, 0, 0, 0.3));
    }
}

.logo-icon:hover {
    transform: scale(1.06);
}

/* === Icon area === */
.icon-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* === Expandable area (timer) — expansion horizontale === */
.expand-area {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    max-width: 0;
    opacity: 0;
    margin-left: 0;
    /* Spring fluide à l'expansion (axe horizontal) */
    transition:
        max-width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease,
        margin-left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.expand-area.visible {
    max-width: 160px;
    opacity: 1;
    margin-left: 10px;
}

/* === Timer === */
.timer {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.75);
    width: 42px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
}

/* === Processing state — dots animés === */
.voice-input.processing {
    pointer-events: none;
}

.processing-text {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    display: none;
    margin-left: 10px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
}

.voice-input.processing .processing-text {
    display: block;
}

/* Dots animés quand le texte est "Traitement..." */
.processing-dots {
    display: inline-flex;
    gap: 3px;
    margin-left: 4px;
    vertical-align: middle;
}

.processing-dots span {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.7);
    display: inline-block;
    animation: dot-bounce 1.4s ease-in-out infinite;
}
.processing-dots span:nth-child(2) { animation-delay: 0.2s; }
.processing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
}

/* === Flash de succès (transition processing → idle) === */
.logo-icon.success {
    animation: success-bounce 0.5s ease-out forwards !important;
    filter: drop-shadow(0 0 18px rgba(74, 222, 128, 0.9))
            drop-shadow(0 0 6px rgba(74, 222, 128, 1)) !important;
}

@keyframes success-bounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.12); }
    70%  { transform: scale(0.97); }
    100% { transform: scale(1); }
}

/* === Anneau réactif à la voix === */
.ring {
    position: absolute;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: 2px solid rgba(96, 165, 250, 0);
    opacity: 0;
    pointer-events: none;
    /* Pas de transition CSS : animé frame-par-frame par JS */
}

/* === Error state === */
.error-text {
    font-size: 12px;
    color: #F87171;
    display: none;
    margin-left: 10px;
    text-align: left;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.voice-input.error .error-text {
    display: block;
}

.voice-input.error {
    pointer-events: none;
    border-color: transparent !important;
    box-shadow: none !important;
    animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

/* Glow rouge sur le logo en cas d'erreur */
.voice-input.error .logo-icon {
    filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.7))
            drop-shadow(0 0 4px rgba(239, 68, 68, 0.9));
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-5px); }
    30% { transform: translateX(5px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    90% { transform: translateX(2px); }
}
</style>
</head>
<body>

<div class="voice-input" id="voice-input">
    <div class="icon-area" id="icon-area">
        <img class="logo-icon" id="logo-icon" src="logo.png" alt="The Wave" />
        <div class="ring" id="ring"></div>
    </div>

    <div class="expand-area" id="expand-area">
        <div class="timer" id="timer">00:00</div>
    </div>

    <span class="processing-text" id="processing-text">
        Traitement
        <span class="processing-dots" id="processing-dots">
            <span></span><span></span><span></span>
        </span>
    </span>
    <span class="error-text" id="error-text">Erreur</span>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let currentState = 'idle';
let bridge = null;
let timerSeconds = 0;
let timerInterval = null;
let ringAnimId = null;
let targetAmplitude = 0.0;
let amplitude = 0.0;

const voiceInput     = document.getElementById('voice-input');
const logoIcon       = document.getElementById('logo-icon');
const expandArea     = document.getElementById('expand-area');
const timerEl        = document.getElementById('timer');
const processingText = document.getElementById('processing-text');
const processingDots = document.getElementById('processing-dots');
const ring           = document.getElementById('ring');

// === QWebChannel Bridge ===
if (typeof QWebChannel !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
    });
}

// === Appelé depuis Python pour mettre à jour l'amplitude ===
function updateAmplitude(value) {
    targetAmplitude = Math.min(1.0, Math.max(0.0, value));
}

// === Gestion des états ===
function applyIdleState() {
    logoIcon.style.display = '';
    expandArea.classList.remove('visible');
    voiceInput.classList.remove('active', 'processing', 'error');
    processingDots.style.display = '';
    stopTimer();
    stopRingAnimation();
    targetAmplitude = 0.0;
}

function doSuccessFlash(callback) {
    logoIcon.classList.add('success');
    setTimeout(function() {
        logoIcon.classList.remove('success');
        callback();
    }, 800);
}

function setState(state) {
    var prevState = currentState;

    // Interception : succès = idle depuis processing
    if (state === 'idle' && prevState === 'processing') {
        doSuccessFlash(function() {
            currentState = 'idle';
            applyIdleState();
        });
        return;
    }

    currentState = state;

    if (state === 'idle') {
        applyIdleState();

    } else if (state === 'recording') {
        logoIcon.style.display = '';
        expandArea.classList.add('visible');
        voiceInput.classList.add('active');
        voiceInput.classList.remove('processing', 'error');
        processingDots.style.display = '';
        startTimer();
        startRingAnimation();

    } else if (state === 'processing') {
        logoIcon.style.display = '';
        expandArea.classList.remove('visible');
        voiceInput.classList.add('active', 'processing');
        voiceInput.classList.remove('error');
        // Réaffiche le texte par défaut avec les dots
        processingText.childNodes[0].textContent = 'Traitement';
        processingDots.style.display = '';
        stopTimer();
        stopRingAnimation();
        targetAmplitude = 0.0;

    } else if (state === 'error') {
        logoIcon.style.display = '';
        expandArea.classList.remove('visible');
        voiceInput.classList.add('active', 'error');
        voiceInput.classList.remove('processing');
        processingDots.style.display = 'none';
        stopTimer();
        stopRingAnimation();
        targetAmplitude = 0.0;
    }
}

// === Click droit sur le logo → Settings ===
logoIcon.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (bridge && bridge.on_settings_clicked) {
        bridge.on_settings_clicked();
    }
});

// === Click + Drag ===
const DRAG_THRESHOLD = 5;
let dragStartX = 0, dragStartY = 0;
let isDragging = false;
let isMouseDown = false;

voiceInput.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isMouseDown = true;
    isDragging = false;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
    if (!isMouseDown) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    if (!isDragging && (Math.abs(dx) >= DRAG_THRESHOLD || Math.abs(dy) >= DRAG_THRESHOLD)) {
        isDragging = true;
    }
    if (isDragging && bridge && bridge.move_by) {
        bridge.move_by(dx, dy);
        dragStartX = e.screenX;
        dragStartY = e.screenY;
    }
});

document.addEventListener('mouseup', function(e) {
    if (!isMouseDown) return;
    isMouseDown = false;
    if (!isDragging) {
        if (currentState === 'idle') {
            if (bridge && bridge.on_start_clicked) bridge.on_start_clicked();
        } else if (currentState === 'recording') {
            if (bridge && bridge.on_stop_clicked) bridge.on_stop_clicked();
        }
    }
    isDragging = false;
});

// === Timer ===
function startTimer() {
    timerSeconds = 0;
    timerEl.textContent = '00:00';
    timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
        const secs = (timerSeconds % 60).toString().padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    timerSeconds = 0;
    timerEl.textContent = '00:00';
}

// === Anneau réactif à la voix (amplitude reçue depuis Python) ===
function startRingAnimation() {
    if (ringAnimId) return;
    animateRing();
}

function stopRingAnimation() {
    if (ringAnimId) {
        cancelAnimationFrame(ringAnimId);
        ringAnimId = null;
    }
    ring.style.opacity = '0';
    ring.style.transform = 'scale(1)';
    ring.style.boxShadow = 'none';
    targetAmplitude = 0.0;
}

function animateRing() {
    amplitude += (targetAmplitude - amplitude) * 0.12;

    const time = performance.now() / 1000;
    // Pulsation de base lente même sans voix
    const basePulse = Math.sin(time * 1.5) * 0.5 + 0.5;

    // Scale : de 1.0 (collé au logo) à ~1.35 (voix forte)
    const scale = 1.0 + basePulse * 0.06 + amplitude * 0.28;

    // Opacité : subtile au repos, forte quand on parle
    const opacity = 0.2 + basePulse * 0.15 + amplitude * 0.55;

    // Couleur bleue qui s'intensifie avec l'amplitude
    const intensity = basePulse * 0.2 + amplitude * 0.8;
    const r = Math.round(59  + intensity * 37);   // 59 → 96
    const g = Math.round(130 + intensity * 35);   // 130 → 165
    const b = 250;

    // Glow bleu autour de l'anneau
    const glowSize    = (4  + amplitude * 14).toFixed(0);
    const glowOpacity = (0.15 + amplitude * 0.5).toFixed(2);

    ring.style.transform   = `scale(${scale.toFixed(3)})`;
    ring.style.opacity     = opacity.toFixed(3);
    ring.style.borderColor = `rgb(${r},${g},${b})`;
    ring.style.boxShadow   = `0 0 ${glowSize}px rgba(${r},${g},${b},${glowOpacity})`;

    ringAnimId = requestAnimationFrame(animateRing);
}

// === Appelé depuis Python pour le texte de l'étape en cours ===
function updateStep(text) {
    // Remplace le texte mais garde les dots
    processingText.childNodes[0].textContent = text;
    processingDots.style.display = '';
}

// === Appelé depuis Python pour le texte d'erreur ===
function setErrorText(text) {
    document.getElementById('error-text').textContent = text;
}

// === Appelé depuis Python pour afficher un aperçu de transcription ===
function showPreview(text) {
    // Affiche le texte sans les dots (c'est du contenu, pas du "traitement")
    processingText.childNodes[0].textContent = text;
    processingDots.style.display = 'none';
}
</script>
</body>
</html>
