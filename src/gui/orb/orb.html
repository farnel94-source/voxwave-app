<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wave Voice Input</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

/* === Main container === */
.voice-input {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 9999px;
    padding: 4px;
    gap: 0;
    border: 1.5px solid transparent;
    background: transparent;
    /* Spring-like expansion (cubic-bezier custom) */
    transition:
        padding 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.4s ease;
}

/* Active state: transparent, sans pilule */
.voice-input.active {
    padding: 4px;
    border-color: transparent;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

.voice-input.active:hover {
    border-color: transparent;
    box-shadow: none;
}

/* === Logo SVG === */
.logo-icon {
    width: 100px;
    height: 100px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.3s ease;
    /* Idle: respiration subtile via animation */
    animation: breathe 3.5s ease-in-out infinite;
    position: relative;
    z-index: 2;
}

/* Respiration idle — glow blanc ultra-subtil */
@keyframes breathe {
    0%, 100% {
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.1))
                drop-shadow(0 3px 10px rgba(0, 0, 0, 0.35));
    }
    50% {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.22))
                drop-shadow(0 3px 14px rgba(0, 0, 0, 0.3));
    }
}

/* Au recording: logo pulse plus vif */
.voice-input.active .logo-icon {
    animation: breathe-active 1.8s ease-in-out infinite;
}

@keyframes breathe-active {
    0%, 100% {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2))
                drop-shadow(0 2px 12px rgba(0, 0, 0, 0.35));
    }
    50% {
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.45))
                drop-shadow(0 2px 18px rgba(0, 0, 0, 0.3));
    }
}

.logo-icon:hover {
    transform: scale(1.06);
}

/* === Icon area === */
.icon-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* === Aura canvas (derriere le SVG) === */
#aura-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
}

/* === Expandable area (timer) — expansion horizontale === */
.expand-area {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    max-width: 0;
    opacity: 0;
    margin-left: 0;
    /* Spring fluide */
    transition:
        max-width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease,
        margin-left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.expand-area.visible {
    max-width: 160px;
    opacity: 1;
    margin-left: 10px;
}

/* === Timer === */
.timer {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.75);
    width: 42px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
}

/* === Processing state — dots animes === */
.voice-input.processing {
    pointer-events: none;
}

.processing-text {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    display: none;
    margin-left: 10px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
}

.voice-input.processing .processing-text {
    display: block;
}

/* Dots animes */
.processing-dots {
    display: inline-flex;
    gap: 3px;
    margin-left: 4px;
    vertical-align: middle;
}

.processing-dots span {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.7);
    display: inline-block;
    animation: dot-bounce 1.4s ease-in-out infinite;
}
.processing-dots span:nth-child(2) { animation-delay: 0.2s; }
.processing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
}

/* === Flash de succes (transition processing -> idle) === */
.logo-icon.success {
    animation: success-bounce 0.5s ease-out forwards !important;
    filter: drop-shadow(0 0 18px rgba(74, 222, 128, 0.9))
            drop-shadow(0 0 6px rgba(74, 222, 128, 1)) !important;
}

@keyframes success-bounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.12); }
    70%  { transform: scale(0.97); }
    100% { transform: scale(1); }
}

/* === Error state === */
.error-text {
    font-size: 12px;
    color: #F87171;
    display: none;
    margin-left: 10px;
    text-align: left;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.voice-input.error .error-text {
    display: block;
}

.voice-input.error {
    pointer-events: none;
    border-color: transparent !important;
    box-shadow: none !important;
    animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

/* Glow rouge sur le logo en cas d'erreur */
.voice-input.error .logo-icon {
    filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.7))
            drop-shadow(0 0 4px rgba(239, 68, 68, 0.9));
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-5px); }
    30% { transform: translateX(5px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    90% { transform: translateX(2px); }
}
</style>
</head>
<body>

<div class="voice-input" id="voice-input">
    <div class="icon-area" id="icon-area">
        <canvas id="aura-canvas"></canvas>
        <!-- Logo SVG inline — 3 ondes stylisees "The Wave" -->
        <svg class="logo-icon" id="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#60A5FA" />
                    <stop offset="50%" stop-color="#818CF8" />
                    <stop offset="100%" stop-color="#A78BFA" />
                </linearGradient>
            </defs>
            <!-- Cercle de fond subtil -->
            <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <!-- Onde 1 (gauche) -->
            <path d="M 22 58 Q 30 38, 38 50 Q 46 62, 50 50" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
            <!-- Onde 2 (centre — la plus grande) -->
            <path d="M 30 58 Q 40 28, 50 50 Q 60 72, 70 42" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
            <!-- Onde 3 (droite) -->
            <path d="M 50 50 Q 54 38, 62 50 Q 70 62, 78 42" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
        </svg>
    </div>

    <div class="expand-area" id="expand-area">
        <div class="timer" id="timer">00:00</div>
    </div>

    <span class="processing-text" id="processing-text">
        Traitement
        <span class="processing-dots" id="processing-dots">
            <span></span><span></span><span></span>
        </span>
    </span>
    <span class="error-text" id="error-text">Erreur</span>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let currentState = 'idle';
let bridge = null;
let timerSeconds = 0;
let timerInterval = null;
let auraAnimId = null;
let targetAmplitude = 0.0;
let amplitude = 0.0;

const voiceInput     = document.getElementById('voice-input');
const logoIcon       = document.getElementById('logo-icon');
const expandArea     = document.getElementById('expand-area');
const timerEl        = document.getElementById('timer');
const processingText = document.getElementById('processing-text');
const processingDots = document.getElementById('processing-dots');
const auraCanvas     = document.getElementById('aura-canvas');
const auraCtx        = auraCanvas.getContext('2d');

// === Setup canvas HD (devicePixelRatio) ===
const AURA_SIZE = 140; // CSS pixels — depasse du logo (100px) pour le halo
const dpr = window.devicePixelRatio || 1;
auraCanvas.width = AURA_SIZE * dpr;
auraCanvas.height = AURA_SIZE * dpr;
auraCanvas.style.width = AURA_SIZE + 'px';
auraCanvas.style.height = AURA_SIZE + 'px';
auraCtx.scale(dpr, dpr);

// === QWebChannel Bridge ===
if (typeof QWebChannel !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
    });
}

// === Appele depuis Python pour mettre a jour l'amplitude ===
function updateAmplitude(value) {
    targetAmplitude = Math.min(1.0, Math.max(0.0, value));
}

// === Gestion des etats ===
function applyIdleState() {
    logoIcon.style.display = '';
    expandArea.classList.remove('visible');
    voiceInput.classList.remove('active', 'processing', 'error');
    processingDots.style.display = '';
    stopTimer();
    stopAuraAnimation();
    targetAmplitude = 0.0;
}

function doSuccessFlash(callback) {
    logoIcon.classList.add('success');
    setTimeout(function() {
        logoIcon.classList.remove('success');
        callback();
    }, 800);
}

function setState(state) {
    var prevState = currentState;

    // Interception : succes = idle depuis processing
    if (state === 'idle' && prevState === 'processing') {
        doSuccessFlash(function() {
            currentState = 'idle';
            applyIdleState();
        });
        return;
    }

    currentState = state;

    if (state === 'idle') {
        applyIdleState();

    } else if (state === 'recording') {
        logoIcon.style.display = '';
        expandArea.classList.add('visible');
        voiceInput.classList.add('active');
        voiceInput.classList.remove('processing', 'error');
        processingDots.style.display = '';
        startTimer();
        startAuraAnimation();

    } else if (state === 'processing') {
        logoIcon.style.display = '';
        expandArea.classList.remove('visible');
        voiceInput.classList.add('active', 'processing');
        voiceInput.classList.remove('error');
        processingText.childNodes[0].textContent = 'Traitement';
        processingDots.style.display = '';
        stopTimer();
        stopAuraAnimation();
        targetAmplitude = 0.0;

    } else if (state === 'error') {
        logoIcon.style.display = '';
        expandArea.classList.remove('visible');
        voiceInput.classList.add('active', 'error');
        voiceInput.classList.remove('processing');
        processingDots.style.display = 'none';
        stopTimer();
        stopAuraAnimation();
        targetAmplitude = 0.0;
    }
}

// === Click droit sur le logo -> Settings ===
logoIcon.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (bridge && bridge.on_settings_clicked) {
        bridge.on_settings_clicked();
    }
});

// === Click + Drag ===
const DRAG_THRESHOLD = 5;
let dragStartX = 0, dragStartY = 0;
let isDragging = false;
let isMouseDown = false;

voiceInput.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isMouseDown = true;
    isDragging = false;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
    if (!isMouseDown) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    if (!isDragging && (Math.abs(dx) >= DRAG_THRESHOLD || Math.abs(dy) >= DRAG_THRESHOLD)) {
        isDragging = true;
    }
    if (isDragging && bridge && bridge.move_by) {
        bridge.move_by(dx, dy);
        dragStartX = e.screenX;
        dragStartY = e.screenY;
    }
});

document.addEventListener('mouseup', function(e) {
    if (!isMouseDown) return;
    isMouseDown = false;
    if (!isDragging) {
        if (currentState === 'idle') {
            if (bridge && bridge.on_start_clicked) bridge.on_start_clicked();
        } else if (currentState === 'recording') {
            if (bridge && bridge.on_stop_clicked) bridge.on_stop_clicked();
        }
    }
    isDragging = false;
});

// === Timer ===
function startTimer() {
    timerSeconds = 0;
    timerEl.textContent = '00:00';
    timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
        const secs = (timerSeconds % 60).toString().padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    timerSeconds = 0;
    timerEl.textContent = '00:00';
}

// === Aura canvas reactive a la voix ===
function startAuraAnimation() {
    if (auraAnimId) return;
    animateAura();
}

function stopAuraAnimation() {
    if (auraAnimId) {
        cancelAnimationFrame(auraAnimId);
        auraAnimId = null;
    }
    // Clear canvas pour economiser le CPU en idle
    auraCtx.clearRect(0, 0, AURA_SIZE, AURA_SIZE);
    amplitude = 0.0;
    targetAmplitude = 0.0;
}

function animateAura() {
    // Lissage de l'amplitude (spring-like)
    amplitude += (targetAmplitude - amplitude) * 0.12;

    const time = performance.now() / 1000;
    // Pulsation de base lente meme sans voix
    const basePulse = Math.sin(time * 1.5) * 0.5 + 0.5;

    const cx = AURA_SIZE / 2;
    const cy = AURA_SIZE / 2;

    // Rayon de l'aura: 30px au repos, jusqu'a 65px en voix forte
    const innerRadius = 20 + basePulse * 3;
    const outerRadius = 35 + basePulse * 8 + amplitude * 30;

    // Opacite globale: subtile au repos, forte quand on parle
    const globalAlpha = 0.15 + basePulse * 0.1 + amplitude * 0.55;

    // Couleur bleue qui s'intensifie avec l'amplitude
    const intensity = basePulse * 0.2 + amplitude * 0.8;
    const r = Math.round(96  + intensity * 40);   // bleu -> violet leger
    const g = Math.round(165 - intensity * 30);   // desature un peu
    const b = 250;

    // Clear
    auraCtx.clearRect(0, 0, AURA_SIZE, AURA_SIZE);

    // Gradient radial : centre lumineux -> bord transparent
    const grad = auraCtx.createRadialGradient(cx, cy, innerRadius, cx, cy, outerRadius);
    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${globalAlpha.toFixed(2)})`);
    grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${(globalAlpha * 0.5).toFixed(2)})`);
    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

    auraCtx.fillStyle = grad;
    auraCtx.fillRect(0, 0, AURA_SIZE, AURA_SIZE);

    // Deuxieme couche: halo plus large et plus doux (profondeur)
    if (amplitude > 0.1) {
        const outerGlow = outerRadius + amplitude * 15;
        const grad2 = auraCtx.createRadialGradient(cx, cy, outerRadius * 0.8, cx, cy, outerGlow);
        grad2.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${(amplitude * 0.15).toFixed(2)})`);
        grad2.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
        auraCtx.fillStyle = grad2;
        auraCtx.fillRect(0, 0, AURA_SIZE, AURA_SIZE);
    }

    auraAnimId = requestAnimationFrame(animateAura);
}

// === Appele depuis Python pour le texte de l'etape en cours ===
function updateStep(text) {
    processingText.childNodes[0].textContent = text;
    processingDots.style.display = '';
}

// === Appele depuis Python pour le texte d'erreur ===
function setErrorText(text) {
    document.getElementById('error-text').textContent = text;
}

// === Appele depuis Python pour afficher un apercu de transcription ===
function showPreview(text) {
    processingText.childNodes[0].textContent = text;
    processingDots.style.display = 'none';
}
</script>
</body>
</html>
