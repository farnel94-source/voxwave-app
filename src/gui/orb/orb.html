<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxWave Voice Input</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

/* === Main container === */
.voice-input {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 9999px;
    padding: 4px;
    gap: 0;
    border: 1.5px solid transparent;
    background: transparent;
    transition:
        padding 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.4s ease;
}

.voice-input.active {
    padding: 4px;
    border-color: transparent;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

.voice-input.active:hover {
    border-color: transparent;
    box-shadow: none;
}

/* === Icon area (contient SVG + canvas) === */
.icon-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
}

/* === Aura canvas (derriere le SVG) === */
#aura-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
    border-radius: 50%;
}

/* === Cercle contour subtil autour du logo === */
.logo-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(15, 23, 42, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.3s ease, border-color 0.3s ease;
    animation: breathe 3.5s ease-in-out infinite;
}

/* Respiration idle — glow blanc ultra-subtil */
@keyframes breathe {
    0%, 100% {
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.1))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    }
    50% {
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2))
                drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }
}

/* Au recording: pulse plus vif + contour bleu */
.voice-input.active .logo-circle {
    animation: breathe-active 1.8s ease-in-out infinite;
    border-color: rgba(59, 130, 246, 0.5);
}

@keyframes breathe-active {
    0%, 100% {
        filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.2))
                drop-shadow(0 1px 4px rgba(0, 0, 0, 0.35));
    }
    50% {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4))
                drop-shadow(0 1px 6px rgba(0, 0, 0, 0.3));
    }
}

.logo-circle:hover {
    transform: scale(1.06);
}

/* === Logo SVG inside circle === */
.logo-icon {
    width: 28px;
    height: 28px;
}

/* === Expandable area (timer) === */
.expand-area {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    max-width: 0;
    opacity: 0;
    margin-left: 0;
    transition:
        max-width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease,
        margin-left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.expand-area.visible {
    max-width: 160px;
    opacity: 1;
    margin-left: 10px;
}

/* === Timer === */
.timer {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.75);
    width: 42px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

/* === Processing state === */
.voice-input.processing {
    pointer-events: none;
}

.processing-text {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    display: none;
    margin-left: 10px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

.voice-input.processing .processing-text {
    display: block;
}

.processing-dots {
    display: inline-flex;
    gap: 3px;
    margin-left: 4px;
    vertical-align: middle;
}

.processing-dots span {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.7);
    display: inline-block;
    animation: dot-bounce 1.4s ease-in-out infinite;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.4);
}
.processing-dots span:nth-child(2) { animation-delay: 0.2s; }
.processing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
}

/* === Flash de succes (transition processing -> idle) === */
.logo-circle.success {
    animation: success-bounce 0.5s ease-out forwards !important;
    filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.8))
            drop-shadow(0 0 2px rgba(74, 222, 128, 1)) !important;
}

@keyframes success-bounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.06); }
    70%  { transform: scale(0.98); }
    100% { transform: scale(1); }
}

/* === Error state === */
.error-text {
    font-size: 12px;
    color: #F87171;
    display: none;
    margin-left: 10px;
    text-align: left;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

.voice-input.error .error-text {
    display: block;
}

.voice-input.error {
    pointer-events: none;
    border-color: transparent !important;
    box-shadow: none !important;
    animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}

.voice-input.error .logo-circle {
    filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.7))
            drop-shadow(0 0 2px rgba(239, 68, 68, 0.9));
    border-color: rgba(239, 68, 68, 0.5);
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-3px); }
    30% { transform: translateX(3px); }
    45% { transform: translateX(-2px); }
    60% { transform: translateX(2px); }
    75% { transform: translateX(-1px); }
    90% { transform: translateX(1px); }
}
</style>
</head>
<body>

<div class="voice-input" id="voice-input">
    <div class="icon-area" id="icon-area">
        <canvas id="aura-canvas"></canvas>
        <!-- Cercle contour + Logo SVG ondes VW -->
        <div class="logo-circle" id="logo-circle">
            <svg class="logo-icon" id="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
                        <stop offset="100%" stop-color="rgba(200,200,210,0.7)" />
                    </linearGradient>
                </defs>
                <!-- Tracé cursif "vw" continu -->
                <path d="M 20,45 C 22,45 26,60 32,60 C 38,60 38,40 42,40 C 46,40 46,58 50,58 C 54,58 54,40 58,40 C 62,40 62,58 66,58 C 70,58 74,42 80,42"
                      stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </div>
    </div>

    <div class="expand-area" id="expand-area">
        <div class="timer" id="timer">00:00</div>
    </div>

    <span class="processing-text" id="processing-text">
        Traitement
        <span class="processing-dots" id="processing-dots">
            <span></span><span></span><span></span>
        </span>
    </span>
    <span class="error-text" id="error-text">Erreur</span>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
let currentState = 'idle';
let successFlashTimeout = null;
let bridge = null;
let timerSeconds = 0;
let timerInterval = null;
let auraAnimId = null;
let targetAmplitude = 0.0;
let amplitude = 0.0;
let smoothedVolume = 0.0;

const voiceInput     = document.getElementById('voice-input');
const logoCircle     = document.getElementById('logo-circle');
const logoIcon       = document.getElementById('logo-icon');
const expandArea     = document.getElementById('expand-area');
const timerEl        = document.getElementById('timer');
const processingText = document.getElementById('processing-text');
const processingDots = document.getElementById('processing-dots');
const auraCanvas     = document.getElementById('aura-canvas');
const auraCtx        = auraCanvas.getContext('2d');

// === Setup canvas HD (devicePixelRatio) ===
// 200px pour laisser de la place aux particules qui orbitent loin
const AURA_SIZE = 90;
const dpr = window.devicePixelRatio || 1;
auraCanvas.width = AURA_SIZE * dpr;
auraCanvas.height = AURA_SIZE * dpr;
auraCanvas.style.width = AURA_SIZE + 'px';
auraCanvas.style.height = AURA_SIZE + 'px';
auraCtx.scale(dpr, dpr);

// === Constantes aura (AudioVisualizer.tsx) ===
const CORE_BASE_RADIUS = 12;
const NUM_PARTICLES = 15;

// === QWebChannel Bridge ===
if (typeof QWebChannel !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
    });
}

// === Appele depuis Python pour mettre a jour l'amplitude ===
function updateAmplitude(value) {
    targetAmplitude = Math.min(1.0, Math.max(0.0, value));
}

// === Gestion des etats ===
function applyIdleState() {
    logoCircle.style.display = '';
    expandArea.classList.remove('visible');
    voiceInput.classList.remove('active', 'processing', 'error');
    processingDots.style.display = '';
    stopTimer();
    stopAuraAnimation();
    targetAmplitude = 0.0;
    smoothedVolume = 0.0;
}

function doSuccessFlash(callback) {
    logoCircle.classList.add('success');
    successFlashTimeout = setTimeout(function() {
        successFlashTimeout = null;
        logoCircle.classList.remove('success');
        callback();
    }, 800);
}

function setState(state) {
    // Cancel any pending success flash timeout
    if (successFlashTimeout) {
        clearTimeout(successFlashTimeout);
        successFlashTimeout = null;
        logoCircle.classList.remove('success');
    }

    var prevState = currentState;

    if (state === 'idle' && prevState === 'processing') {
        doSuccessFlash(function() {
            currentState = 'idle';
            applyIdleState();
        });
        return;
    }

    currentState = state;

    if (state === 'idle') {
        applyIdleState();

    } else if (state === 'recording') {
        logoCircle.style.display = '';
        expandArea.classList.add('visible');
        voiceInput.classList.add('active');
        voiceInput.classList.remove('processing', 'error');
        processingDots.style.display = '';
        startTimer();
        startAuraAnimation();

    } else if (state === 'processing') {
        logoCircle.style.display = '';
        expandArea.classList.remove('visible');
        voiceInput.classList.add('active', 'processing');
        voiceInput.classList.remove('error');
        processingText.childNodes[0].textContent = '...';
        processingDots.style.display = '';
        stopTimer();
        stopAuraAnimation();
        targetAmplitude = 0.0;

    } else if (state === 'error') {
        logoCircle.style.display = '';
        expandArea.classList.remove('visible');
        voiceInput.classList.add('active', 'error');
        voiceInput.classList.remove('processing');
        processingDots.style.display = 'none';
        stopTimer();
        stopAuraAnimation();
        targetAmplitude = 0.0;
    }
}

// === Click droit sur le logo -> Settings ===
logoCircle.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (bridge && bridge.on_settings_clicked) {
        bridge.on_settings_clicked();
    }
});

// === Click + Drag ===
const DRAG_THRESHOLD = 5;
let dragStartX = 0, dragStartY = 0;
let isDragging = false;
let isMouseDown = false;

voiceInput.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isMouseDown = true;
    isDragging = false;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
    if (!isMouseDown) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    if (!isDragging && (Math.abs(dx) >= DRAG_THRESHOLD || Math.abs(dy) >= DRAG_THRESHOLD)) {
        isDragging = true;
    }
    if (isDragging && bridge && bridge.move_by) {
        bridge.move_by(dx, dy);
        dragStartX = e.screenX;
        dragStartY = e.screenY;
    }
});

document.addEventListener('mouseup', function(e) {
    if (!isMouseDown) return;
    isMouseDown = false;
    if (!isDragging) {
        if (currentState === 'idle') {
            if (bridge && bridge.on_start_clicked) bridge.on_start_clicked();
        } else if (currentState === 'recording') {
            if (bridge && bridge.on_stop_clicked) bridge.on_stop_clicked();
        }
    }
    isDragging = false;
});

// === Timer ===
function startTimer() {
    timerSeconds = 0;
    timerEl.textContent = '00:00';
    timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
        const secs = (timerSeconds % 60).toString().padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    timerSeconds = 0;
    timerEl.textContent = '00:00';
}

// === Aura canvas (AudioVisualizer.tsx style) ===
function startAuraAnimation() {
    if (auraAnimId) return;
    animateAura();
}

function stopAuraAnimation() {
    if (auraAnimId) {
        cancelAnimationFrame(auraAnimId);
        auraAnimId = null;
    }
    auraCtx.clearRect(0, 0, AURA_SIZE, AURA_SIZE);
    amplitude = 0.0;
    targetAmplitude = 0.0;
    smoothedVolume = 0.0;
}

function animateAura() {
    // Lissage du volume (facteur 0.2 comme AudioVisualizer.tsx)
    smoothedVolume += (targetAmplitude - smoothedVolume) * 0.2;
    amplitude += (targetAmplitude - amplitude) * 0.12;

    const time = performance.now() / 1000;
    // Intensité avec courbe de puissance (comme la ref)
    const intensity = Math.pow(smoothedVolume * 2.5, 1.2);
    const clampedIntensity = Math.min(intensity, 1.5);

    const cx = AURA_SIZE / 2;
    const cy = AURA_SIZE / 2;

    auraCtx.clearRect(0, 0, AURA_SIZE, AURA_SIZE);

    // Clip circulaire pour éviter le carré visible autour de l'aura
    auraCtx.save();
    auraCtx.beginPath();
    auraCtx.arc(cx, cy, AURA_SIZE / 2, 0, Math.PI * 2);
    auraCtx.clip();

    // === 0. Shadow layer (contraste sur fond clair) ===
    const shadowRadius = CORE_BASE_RADIUS + 30 + clampedIntensity * 35;
    const shadowGrad = auraCtx.createRadialGradient(cx, cy, CORE_BASE_RADIUS * 0.5, cx, cy, shadowRadius);
    shadowGrad.addColorStop(0, 'rgba(0, 0, 0, ' + (0.1 + clampedIntensity * 0.15).toFixed(3) + ')');
    shadowGrad.addColorStop(0.6, 'rgba(0, 0, 0, ' + (0.05 + clampedIntensity * 0.08).toFixed(3) + ')');
    shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    auraCtx.fillStyle = shadowGrad;
    auraCtx.fillRect(0, 0, AURA_SIZE, AURA_SIZE);

    // === 1. Outer Aura (respire avec Math.sin, même sans voix) ===
    const breathe = Math.sin(time * 2) * 0.5 + 0.5;
    const auraDynamicRadius = CORE_BASE_RADIUS + 20 + breathe * 6 + clampedIntensity * 30;

    const auraGradient = auraCtx.createRadialGradient(cx, cy, CORE_BASE_RADIUS, cx, cy, auraDynamicRadius);
    auraGradient.addColorStop(0, 'rgba(99, 102, 241, ' + (0.08 + clampedIntensity * 0.45).toFixed(3) + ')');
    auraGradient.addColorStop(0.5, 'rgba(59, 130, 246, ' + (0.04 + clampedIntensity * 0.25).toFixed(3) + ')');
    auraGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    auraCtx.fillStyle = auraGradient;
    auraCtx.fillRect(0, 0, AURA_SIZE, AURA_SIZE);

    // === 2. Core Glow (intense, proche du centre) ===
    const coreDynamicRadius = CORE_BASE_RADIUS + clampedIntensity * 35;

    const coreGradient = auraCtx.createRadialGradient(cx, cy, 0, cx, cy, coreDynamicRadius);
    coreGradient.addColorStop(0, 'rgba(34, 211, 238, ' + (0.4 + clampedIntensity * 0.6).toFixed(3) + ')');
    coreGradient.addColorStop(0.6, 'rgba(59, 130, 246, ' + (0.15 + clampedIntensity * 0.5).toFixed(3) + ')');
    coreGradient.addColorStop(1, 'rgba(59, 130, 246, 0)');

    auraCtx.fillStyle = coreGradient;
    auraCtx.fillRect(0, 0, AURA_SIZE, AURA_SIZE);

    // === 3. Energy Particles (15 points scintillants) ===
    for (var i = 0; i < NUM_PARTICLES; i++) {
        var angle = (i / NUM_PARTICLES) * Math.PI * 2 + time * 0.5 + (i * 132.5);
        var distance = CORE_BASE_RADIUS + (Math.sin(time * 3 + i * 54) * 6) + (clampedIntensity * 40);
        var px = cx + Math.cos(angle) * distance;
        var py = cy + Math.sin(angle) * distance;

        // Taille et opacité liées à l'intensité
        var particleSize = 1.5 + clampedIntensity * 1.5;
        var particleAlpha = 0.2 + clampedIntensity * 0.7 + Math.sin(time * 4 + i * 27) * 0.15;
        particleAlpha = Math.max(0, Math.min(1, particleAlpha));

        auraCtx.beginPath();
        auraCtx.arc(px, py, particleSize, 0, Math.PI * 2);
        auraCtx.fillStyle = 'rgba(147, 197, 253, ' + particleAlpha.toFixed(3) + ')';
        auraCtx.fill();
    }

    // === 4. Edge ring (définit le bord sur fond clair) ===
    auraCtx.beginPath();
    auraCtx.arc(cx, cy, auraDynamicRadius - 1, 0, Math.PI * 2);
    auraCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
    auraCtx.lineWidth = 1.5;
    auraCtx.stroke();

    auraCtx.restore();

    auraAnimId = requestAnimationFrame(animateAura);
}

// === Appele depuis Python pour le texte de l'etape en cours ===
function updateStep(text) {
    processingText.childNodes[0].textContent = text;
    processingDots.style.display = '';
}

// === Appele depuis Python pour le texte d'erreur ===
function setErrorText(text) {
    document.getElementById('error-text').textContent = text;
}

// === Appele depuis Python pour afficher un apercu de transcription ===
function showPreview(text) {
    processingText.childNodes[0].textContent = text;
    processingDots.style.display = 'none';
}
</script>
</body>
</html>
